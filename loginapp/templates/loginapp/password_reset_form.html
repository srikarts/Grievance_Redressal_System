{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset | GRS</title>
    <link rel="stylesheet" href="{% static 'loginapp/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="overlay-text">
                <!-- <h1>Welcome to <br> Resolution Center.</h1>
                <p>We're here to help.</p> -->
            </div>
        </div>
        <div class="right-panel">
            <div class="login-card">
                <h2>Forgot your password?</h2>
                <p>Enter your email address and we'll send you a one-time OTP to reset your password.</p>
                {% for message in messages %}
                    <div class="error-message">{{ message }}</div>
                {% endfor %}
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" required>
                    </div>
                    <button type="submit" class="login-button">Send OTP</button>
                </form>
                <p class="signup-text"><a href="{% url 'login' %}" class="signup-link">Back to Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
