{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP & Reset Password | GRS</title>
    <link rel="stylesheet" href="{% static 'loginapp/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="overlay-text">
                <!-- <h1>Welcome to <br> Resolution Center.</h1>
                <p>We're here to help.</p> -->
            </div>
        </div>
        <div class="right-panel">
            <div class="login-card">
                <h2>Verify OTP & Reset Password</h2>

                {% for message in messages %}
                    <div class="error-message">{{ message }}</div>
                {% endfor %}

                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="otp">OTP</label>
                        <input type="text" id="otp" name="otp" maxlength="6" required>
                    </div>

                    <div class="form-group">
                        <label for="new_password1">New Password</label>
                        <input type="password" id="new_password1" name="new_password1" required>
                    </div>

                    <div class="form-group">
                        <label for="new_password2">Confirm New Password</label>
                        <input type="password" id="new_password2" name="new_password2" required>
                    </div>

                    <button type="submit" class="login-button">Reset Password</button>
                </form>
                <p class="signup-text"><a href="{% url 'login' %}" class="signup-link">Back to Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
